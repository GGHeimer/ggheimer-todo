<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO for Life</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>TODO for Life</h1>
        </header>
        <aside>
            <div class=" navbar">
                <ul class="nav justify-content-center">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">List tasks</a>
                    </li>
                </ul>
            </div>
        </aside>
        <main>
            <div class="form">
                <form id="createTaskForm">
                    <div class="mb-3">
                        <label for="taskId" class="form-label">ID</label>
                        <input type="number" class="form-control" id="taskId"
                            placeholder="Task ID (number)" required>
                    </div>
                    <div class="mb-3">
                        <label for="taskDesc" class="form-label">Task</label>
                        <input type="text" class="form-control" id="taskDesc"
                            placeholder="Task Description" required>
                    </div>
                    <div class="input-group mb-3 form-label">
                        <label for="cost">Task Cost</label>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">$</span>
                        <input type="text" class="form-control" id="taskCost" aria-label="Amount (to the nearest dollar)">
                        <span class="input-group-text"></span>
                    </div>
                    <div class="mb-3">
                        <label for="taskDueDate" class="form-label">Due Date</label>
                        <input type="date" class="form-control" id="taskDueDate"
                            placeholder="Task Due Date" required>
                    </div>
                    <div class="mb-3">
                        <label for="taskWeight" class="input-group form-label">Order List</label>
                        <input type="number" class="form-control" id="taskWeight"
                            placeholder="Task Weight">
                    </div>
                    <div>
                        <button type="submit" class="btn btn-primary">Submit</button>
                        <a href="./index.html"><button type="button" class="btn btn-secondary">Cancel</button></a>
                    </div>
                </form>
            </div>
        </main>
        <footer>
            <h5>Estevão Tenorio - All Rights Reserved</h5>
        </footer>
    </div>
</body>
<script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app.js" type="module"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore.js" type="module"></script>

<script defer src="main.js" type="module"></script>

</html>
