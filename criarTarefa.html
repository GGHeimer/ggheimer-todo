<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO for Life</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="container">
    <header>
      <div class="text-center">
        <h1>TODO para a vida</h1>
      </div>
    </header>
    <main>
      <div class="text-center">
        <h1>Criar Tarefa</h1>
      </div>
      <div class="form">
        <form id="criarTarefaForm">
          <div>
            <div class="mb-3">
              <label for="nomeTar" class="form-label">Tarefa</label>
              <input type="text" class="form-control" id="nomeTar" placeholder="Descrição Tarefa" required>
            </div>
            <div class="input-group mb-3 form-label">
              <label for="custoTar">Custo da Tarefa</label>
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text">$</span>
              <input type="text" class="form-control" id="custoTar" aria-label="Custo em R$">
              <span class="input-group-text"></span>
            </div>
          <div class="mb-3">
            <label for="dataLimTar" class="form-label">Data Limite</label>
            <input type="date" class="form-control" id="dataLimTar" placeholder="Data Limite da Tarefa" required>
          </div>
      </div>
      <div>
        <button type="submit" class="btn btn-primary" id="criarTarefaForm">Enviar</button>
        <a href="./index.html"><button type="button" class="btn btn-secondary">Cancelar</button></a>
      </div>
      </form>
  </div>
  </main>
  <footer>
    <h5>Estevão Tenorio - Todos os Direitos Reservados</h5>
  </footer>
  </div>
</body>
<script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app.js" type="module"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore.js" type="module"></script>
<script defer src="main.js" type="module"></script>

</html>
