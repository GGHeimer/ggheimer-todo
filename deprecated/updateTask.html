<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO for Life</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="container">
    <header>
      <div class="text-center">
        <h1>TODO for Life</h1>
      </div>
    </header>
    <aside>
      <div class=" navbar">
        <ul class="nav justify-content-center">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">List tasks</a>
          </li>
        </ul>
      </div>
    </aside>
    <main>
      <div class="text-center">
        <h1>UPDATE TASK</h1>
      </div>
      <div class="form">
        <form id="updateTaskForm">
          <div class="mb-3">
            <label for="taskId" class="form-label">Task ID</label>
          </div>
          <div>
            <div class="mb-3">
              <label for="taskDesc" class="form-label">Task</label>
              <textarea type="text" class="form-control" id="taskDesc" placeholder="Task Description" required></textarea>
            </div>
            <div class="input-group mb-3 form-label">
              <label for="cost">Task Cost</label>
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text">$</span>
              <input type="text" class="form-control" id="taskCost" aria-label="Valor em R$">
              <span class="input-group-text"></span>
            </div>
          </div>
          <div class="mb-3">
            <label for="taskDueDate" class="form-label">Due Date</label>
            <input type="date" class="form-control" id="taskDueDate" placeholder="Task Due Date" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Status</label>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="taskStatus" id="statusBacklog" value="b">
              <label class="form-check-label" for="statusBacklog">
                Backlog
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="taskStatus" id="statusOngoing" value="o">
              <label class="form-check-label" for="statusOngoing">
                Ongoing
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="taskStatus" id="statusFinished" value="f">
              <label class="form-check-label" for="statusFinished">
                Finished
              </label>
            </div>
          </div>
          <div>
            <button type="submit" class="btn btn-primary">Submit</button>
            <a href="./index.html"><button type="button" class="btn btn-secondary">Cancel</button></a>
          </div>
        </form>
      </div>
    </main>
    <footer>
      <h5>Estevão Tenorio - All Rights Reserved</h5>
    </footer>
  </div>
</body>
<script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app.js" type="module"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore.js" type="module"></script>
<script defer src="main.js" type="module"></script>

</html>
