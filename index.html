<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO for Life</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>TODO for Life</h1>
    </header>
    <aside>
      <div class=" navbar">
        <ul class="nav justify-content-center">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">List tasks</a>
          </li>
        </ul>
      </div>
    </aside>
    <main>
      <div class="cards m-5 ">

        <div class="card backlog text-bg-secondary mb-3" style="max-width: 18rem; min-width: 15rem;">
          <div class="card-header">
            <h5 class="card-title">Backlog</h5>
          </div>
          <div class="card-body">
            <ul>
            </ul>
          </div>
        </div>

        <div class="card ongoing text-bg-primary mb-3" style="max-width: 18rem; min-width: 15rem;">
          <div class="card-header">
            <h5 class="card-title">Ongoing</h5>
          </div>
          <div class="card-body">
            <ul>
            </ul>
          </div>
        </div>

        <div class="card finished text-bg-success mb-3" style="max-width: 18rem; min-width: 15rem;">
          <div class="card-header finished-tasks">
            <h5 class="card-title">Finished</h5>
          </div>
          <div class="card-body">
            <ul>
            </ul>
          </div>
        </div>
      </div>
      <div class="actions mt-1 text-center align-middle">
        <a href="./createTask.html"><button class="btn btn-primary p-2" style="min-width: 10rem;">Add Task</button></a>
      </div>
    </main>
    <footer>
      <h5>Estevão Tenorio - All Rights Reserved</h5>
    </footer>
  </div>
</body>
<script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app.js" type="module"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore.js" type="module"></script>

  <script defer src="main.js" type="module"></script>

</html>
